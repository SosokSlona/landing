<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#F4F5F7"/>
  <rect x="20" y="20" width="360" height="180" rx="4" fill="#FFFFFF" stroke="#DCE0E5" stroke-width="1"/>
  <!-- Router Icon -->
  <rect x="60" y="90" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#008B8B" stroke-width="2"/>
  <line x1="80" y1="110" x2="80" y2="118" stroke="#008B8B" stroke-width="3"/>
  <line x1="95" y1="110" x2="95" y2="118" stroke="#008B8B" stroke-width="3"/>
  <line x1="110" y1="110" x2="110" y2="118" stroke="#008B8B" stroke-width="3"/>
  <line x1="125" y1="110" x2="125" y2="118" stroke="#008B8B" stroke-width="3"/>
  <!-- WAN Lines -->
  <path d="M100 90 L100 65 L200 65" stroke="#008B8B" stroke-width="2" fill="none"/>
  <circle cx="200" cy="65" r="4" fill="#008B8B"/>
  <text x="215" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#181A1F">WAN 1: Оптика (100 Mbps)</text>
  <path d="M100 130 L100 155 L200 155" stroke="#008B8B" stroke-width="2" fill="none" stroke-dasharray="4"/>
  <circle cx="200" cy="155" r="4" fill="#008B8B"/>
  <text x="215" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4A5058">WAN 2: LTE Failover</text>
  <!-- Switch indicator -->
  <rect x="215" y="100" width="120" height="24" rx="4" fill="#E6F4F4" stroke="#A3D4D4" stroke-width="1"/>
  <text x="275" y="116" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#005A5A" text-anchor="middle">FAILOVER &lt; 3s</text>
</svg>
